title: Woodworks
tagline: Genomics, statistics and the occasional detour
description: Tim Wood's notebook — population genomics, simulation-based inference, and writing about both.
url: "https://timj-wood.github.io"
baseurl: ""
author:
  name: Tim Wood
  email: tim.jwood@outlook.com
  github: timj-wood
  linkedin: timj-wood
lang: en_GB

permalink: /posts/:slug.html
markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, math: true }
  - scope: { path: "" }
    values: { layout: page, image: /images/woodworks-logo-dark.png }

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
