title: Woodworks
tagline: Genomics, statistics and the occasional detour
description: Tim Wood's notebook — population genomics, simulation-based inference, and writing about both.
url: "https://timj-wood.github.io"
baseurl: ""
author:
  name: Tim Wood
lang: en_GB
image: /assets/img/woodworks-logo-dark.png

permalink: /posts/:slug/
markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
